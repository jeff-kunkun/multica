<!doctype html>
<meta charset="utf-8">
<title>Chat naming settings preview</title>
<style>
  body{font:14px system-ui,sans-serif;background:#f7f7f5;color:#242424;padding:40px}
  main{max-width:720px;margin:auto}section{background:#fff;border:1px solid #deded8;border-radius:12px;padding:22px;box-shadow:0 2px 8px #0000000a}
  h1{font-size:24px;margin:0 0 6px}h2{font-size:16px;margin:24px 0 4px}p{color:#6b6b65;margin:0 0 18px}
  .row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ecece7;padding:16px 0}.label{font-weight:600}.hint{color:#777;font-size:12px;margin-top:4px}
  select{padding:8px 12px;border:1px solid #cfcfc8;border-radius:7px;background:white}.stats{border-top:1px solid #ecece7;padding-top:14px;color:#777;font-size:12px}
</style>
<main>
  <h1>General</h1>
  <h2>Chat naming</h2><p>Choose how new chat titles are created.</p>
  <section>
    <div class="row"><div><div class="label">Naming source</div><div class="hint">Runtime is recommended when the server has no model key.</div></div><select><option>Chat agent runtime (recommended)</option><option disabled>Server model key — unavailable</option><option>Rules only</option></select></div>
    <div class="hint">This instance has no MULTICA_LLM_* key configured.</div>
    <div class="stats">Last 24 hours: 12 titled · 9 runtime · 3 rules fallback · 0 failed</div>
  </section>
</main>
