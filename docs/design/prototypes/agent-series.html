<!doctype html>
<html lang="zh-Hans"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>智能体系列设置</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#202020;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:880px;margin:48px auto;padding:0 24px}h1{font-size:22px;font-weight:600;margin:0 0 28px}h2{font-size:15px;margin:28px 0 12px}.card{border:1px solid #e6e6e6;border-radius:8px}.row{padding:20px;display:flex;align-items:center;justify-content:space-between;gap:24px}.row+.row{border-top:1px solid #eee}.description,.meta{color:#737373;font-size:12px}.description{margin-top:4px}.control{width:256px;min-width:0}input,button,select{font:inherit;border:1px solid #ddd;border-radius:6px;min-height:44px;background:white;color:inherit}input,select{width:100%;padding:8px 12px}.meta{display:flex;justify-content:space-between;margin-top:4px}.choices{display:flex;flex-wrap:wrap;gap:4px}button{padding:8px 14px;cursor:pointer}button[aria-pressed=true]{background:#f3f3f3}.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}.toolbar select{width:150px}.group{background:#fafafa;font-size:12px;color:#666;padding:8px 16px}.agent{padding:14px 16px;display:flex;justify-content:space-between;border-bottom:1px solid #eee}.agent:last-child{border:0}@media(max-width:600px){main{margin:24px auto;padding:0 16px}.row{align-items:stretch;flex-direction:column;gap:12px;padding:16px}.control{width:100%}h1{font-size:20px}.toolbar{flex-wrap:wrap}}
</style>
<main><h1>智能体设置</h1><h2>基本资料</h2><div class="card"><div class="row"><div><label for="series">系列</label><div class="description">清空后按运行时和模型自动归类。</div></div><div class="control"><input id="series" placeholder="Claude" maxlength="64"><div class="meta"><span id="source">自动</span><span id="saved"></span></div></div></div></div><h2>自动派单</h2><div class="card"><div class="row"><div>档位<div class="description">按能力匹配任务</div></div><div class="choices"><button>最强</button><button aria-pressed="true">强</button><button>中等</button><button>轻量</button></div></div></div><h2>智能体</h2><div class="toolbar"><label for="grouping">分组</label><select id="grouping"><option value="series">系列</option><option value="none">不分组</option></select></div><div class="card" id="agents"></div></main>
<script>
// Standalone design preview; these sample seats do not call the API.
const input=document.querySelector('#series'),source=document.querySelector('#source'),saved=document.querySelector('#saved'),grouping=document.querySelector('#grouping');
function render(){const name=input.value.trim()||'Claude';source.textContent=input.value.trim()?'手动':'自动';const seats=[{name:'前端智能体',series:name},{name:'代码智能体',series:'Codex'}];const target=document.querySelector('#agents');target.replaceChildren();for(const seat of seats){if(grouping.value==='series'){const heading=document.createElement('div');heading.className='group';heading.textContent=seat.series;target.append(heading)}const row=document.createElement('div');row.className='agent';row.textContent=seat.name;target.append(row)}}
input.addEventListener('input',()=>{saved.textContent='';render()});input.addEventListener('blur',()=>{saved.textContent='已保存'});grouping.addEventListener('change',render);render();
</script></html>
