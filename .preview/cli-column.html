<!doctype html><html><head><meta charset="utf-8"><script src="https://cdn.tailwindcss.com"></script>
<style>.cap{font-size:12px;line-height:16px}.sw{width:28px;height:16px;border-radius:9px;background:#18181b;position:relative;flex-shrink:0}.sw.off{background:#e4e4e7}.sw::after{content:"";position:absolute;top:2px;left:14px;width:12px;height:12px;border-radius:6px;background:#fff}.sw.off::after{left:2px}</style></head>
<body class="bg-white p-6 font-sans"><h2 class="mb-3 text-sm font-semibold">运行时列表 · CLI 列（修复后，每行固定 48px）</h2>
<div id="t" class="w-[300px] rounded-xl border"><div class="flex h-9 items-center px-3 cap text-zinc-500">CLI</div></div>
<script>
const rows=[
["2.1.284 (Claude Code) / 2.1.284","已是最新","text-green-600",1,1,""],
["codex-cli 0.157.1 / 0.158.0","这个 CLI 还不能自动更新","text-red-600",0,0,"no updater for the copy at /Users/kunkun/.codex/packages/standalone/…"],
["1.2.12","这个 CLI 还不能自动更新","",0,0,""],
["2026.0.3 a7762b","这个 CLI 还不能自动更新","",0,0,""],
["0.40.1","这个 CLI 还不能自动更新","",0,0,""],
["1.19.33 / 1.19.33","已是最新","text-green-600",1,1,""],
["0.24.4 / 0.25.0","可更新","",1,0,""]];
const t=document.getElementById('t');
for(const [v,b,c,ctl,on,err] of rows){t.insertAdjacentHTML('beforeend',`<div class="flex h-12 items-center gap-2 border-t px-2 hover:bg-zinc-50" title="${err}">
<div class="flex min-w-0 flex-1 flex-col"><span class="truncate font-mono cap text-zinc-500">${v}</span>
<span class="flex min-w-0 items-center gap-1">${err?'<span class="cap text-red-600">⚠</span>':''}<span class="truncate cap ${c}">${b}</span></span></div>
${ctl?`<div class="flex shrink-0 items-center gap-1.5"><span class="sw ${on?'':'off'}"></span><button class="h-6 rounded-md border px-2 cap">立即更新</button></div>`:''}</div>`)}
</script></body></html>
