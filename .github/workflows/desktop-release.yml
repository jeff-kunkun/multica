name: Desktop Release

# Builds the Desktop installers for every platform on GitHub runners and
# publishes them to the GitHub Release for the pushed tag.
#
# Why this is not another job in release.yml:
#
#   * That workflow's publishing jobs are gated on the canonical upstream repo
#     (`github.repository_owner == 'multica-ai'`), and its `desktop` job needs
#     `release`; on this fork the gate skips `release`, so the desktop job is
#     skipped with it. Desktop releases here would never start.
#   * Its `verify` job runs the Go suite plus govulncheck. A desktop installer
#     has no business waiting on (or being blocked by) that pipeline.
#
# Why it exists at all: uploading a 230 MB DMG from a workstation does not
# finish. The connection to uploads.github.com stalls (the release issue records
# ~90 KB/s outbound and `POST .../assets` returning EOF), `gh release upload`
# still exits 0, and the half-written asset is left in `state=starter` while
# `latest-mac.yml` advertises it — which is how v0.4.56 and v0.4.57 shipped a
# dead auto-update feed. A runner uploads inside GitHub's network, and the
# verification step below fails the run unless every asset is really there.
#
# The three packaging jobs run in parallel and publish to one release, so each
# passes `--scope-dist` to the asset tool: a job must never delete or fail on an
# asset a sibling job is still uploading (DENE-575). `prepare` creates the
# release once up front for the same reason — three jobs racing
# `gh release create` means two of them lose.
#
# Republishing an existing tag (for example after a truncated upload) is a
# workflow_dispatch with that tag: the checked-out commit is the tag itself, so
# the rebuild stays the release's own baseline.

on:
  push:
    tags:
      # GitHub Actions uses glob patterns here, not regex. Match versioned tags
      # broadly at the trigger layer, then enforce strict semver below.
      - "v*.*.*"
      - "!v*-dirty*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild and republish, e.g. v0.4.57"
        required: true
        type: string

permissions:
  contents: write

# Serialize per ref: two runs publishing the same tag would fight over the same
# asset names.
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolve and validate the tag once, and make sure the release exists before
  # any packaging job tries to upload into it.
  prepare:
    # The kun fork publishes Desktop; upstream builds macOS by hand so it can be
    # signed and notarized with Apple credentials CI does not carry. Guard the
    # entry point so this workflow can never double-publish on the upstream
    # repo — every packaging job needs this one.
    if: github.repository == 'jeff-kunkun/multica'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve the release tag
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [[ -z "$tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must look like vX.Y.Z or vX.Y.Z-suffix; got '$tag'."
            exit 1
          fi
          if [[ "$tag" == *-dirty* ]]; then
            echo "::error::Refusing to release from dirty tag '$tag'."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Creating the release here rather than inside each packaging job is what
      # keeps the matrix from racing: `gh release create` is not idempotent, and
      # two jobs reaching it at the same moment both see "no release" and both
      # try to create one.
      - name: Ensure the release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          # Test tags (`vX.Y.Z-test.N`) must be GitHub prereleases. The stable
          # client asks GitHub for /releases/latest, which hides prereleases;
          # a test build published as a full release would become "latest" and
          # the stable feed file would 404 inside it.
          prerelease=()
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-test\.[0-9]+$ ]]; then
            prerelease=(--prerelease)
          fi
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "release $TAG already exists; its assets will be replaced"
            if [[ ${#prerelease[@]} -gt 0 ]]; then
              gh release edit "$TAG" --repo "$REPO" --prerelease
            fi
            exit 0
          fi
          # `|| gh release view` because cli-release.yml creates the same
          # release from the same tag push: whichever workflow loses the race
          # sees the other's release, which is the state this step wants.
          gh release create "$TAG" \
            --repo "$REPO" \
            --verify-tag \
            --title "Multica Desktop $TAG (kun fork)" \
            --generate-notes \
            --notes "macOS (Apple Silicon)、Windows (x64/arm64)、Linux (x64/arm64) 桌面安装包。macOS 为 ad-hoc 签名、未公证，首次打开需在「系统设置 → 隐私与安全性」中放行，或执行 \`xattr -cr /Applications/Multica.app\`；Windows 与 Linux 包未签名。资产由 Desktop Release workflow 构建并上传，上传后会逐个核对 \`state=uploaded\` 与文件大小。" \
            "${prerelease[@]}" \
            || gh release view "$TAG" --repo "$REPO" >/dev/null
          if [[ ${#prerelease[@]} -gt 0 ]]; then
            gh release edit "$TAG" --repo "$REPO" --prerelease
          fi

  package:
    needs: prepare
    strategy:
      # One platform failing must not cancel the others: a release carrying two
      # platforms beats one carrying none, and the failed platform can be
      # rebuilt with a workflow_dispatch on the same tag.
      fail-fast: false
      matrix:
        include:
          # macos-14 is an Apple Silicon runner, so the arm64 package is built
          # natively and the bundled Go CLI is built for the host it targets.
          # Intel macOS is not built here: it has never been part of this
          # fork's release and adding it is a separate decision.
          - os: macos-14
            platform: mac
            archs: "--arm64"
            label: macOS (arm64)
          # Linux and Windows both build x64 and arm64 in one job. This mirrors
          # release.yml's upstream desktop job, which has shipped those four
          # packages cross-built from an x64 runner since before the fork —
          # no arm64 runner needed, and no per-arch job to coordinate.
          - os: ubuntu-latest
            platform: linux
            archs: "--x64 --arm64"
            label: Linux (x64, arm64)
          - os: windows-latest
            platform: win
            archs: "--x64 --arm64"
            label: Windows (x64, arm64)
    runs-on: ${{ matrix.os }}
    env:
      REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout ${{ needs.prepare.outputs.tag }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      # The build baseline is the tag's own tree, but a tag older than a change
      # to the release tooling does not contain it. Take the tooling from the
      # commit whose workflow is running (the tag itself on a tag push, the
      # dispatched branch otherwise) so `workflow_dispatch` can backfill an
      # older tag. It lands at the repo root, outside the apps/desktop tree
      # electron-builder packages, so it cannot end up inside the app.
      - name: Checkout the release tooling from ${{ github.sha }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts/desktop-release-assets.mjs
          sparse-checkout-cone-mode: false

      - name: Record the build commit
        shell: bash
        run: |
          set -euo pipefail
          # The version electron-builder stamps comes from `git describe` on
          # this commit; record it so the log proves which tree was packaged.
          echo "build commit: $(git rev-parse HEAD) ($(git describe --tags --match 'v[0-9]*' --always))"

      # fpm builds the .rpm and shells out to rpmbuild, which no ubuntu runner
      # image carries by default.
      - name: Install rpmbuild
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Deliberately independent from the minimum patch in server/go.mod:
          # releases follow the newest 1.26 patch available to setup-go.
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Record Go toolchain
        run: go version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Desktop — ${{ matrix.label }}
        working-directory: apps/desktop
        env:
          # No code signing anywhere in this matrix. macOS gets an ad-hoc
          # signature (the release carries no Apple Developer credentials, and
          # installed clients already accept it; `package.mjs` also disables
          # notarization when APPLE_TEAM_ID is absent); Windows and Linux ship
          # unsigned, with the CLI carrying the trust boundary.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Flip to "true" in the same change that injects Apple Developer ID
          # secrets (CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID,
          # APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID) and turns
          # CSC_IDENTITY_AUTO_DISCOVERY back on. package.mjs bakes this into
          # the app. Until then macOS only prompts and opens the installer;
          # Windows and Linux still install updates themselves.
          MULTICA_MAC_SIGNED_UPDATES: "false"
          # No publisher token: publishing happens below so the upload can be
          # verified. electron-builder still writes the latest*.yml / beta*.yml
          # feeds and the blockmaps with --publish never.
        run: node scripts/package.mjs --${{ matrix.platform }} ${{ matrix.archs }} --publish never

      - name: Drop zombie assets left by an earlier failed upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node .release-tools/scripts/desktop-release-assets.mjs clean
          --tag "$TAG" --repo "$REPO" --dist apps/desktop/dist --scope-dist
        shell: bash

      - name: Upload assets (feed metadata last)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node .release-tools/scripts/desktop-release-assets.mjs upload
          --tag "$TAG" --repo "$REPO" --dist apps/desktop/dist
        shell: bash

      # Runs even when the upload step failed: `gh release upload` exiting 0
      # says nothing about whether the bytes arrived, so this step is the only
      # thing that decides whether the release is actually usable. A truncated
      # upload must leave a red run, never a silent gap in the feed.
      - name: Verify every asset is uploaded and matches the local build
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: >-
          node .release-tools/scripts/desktop-release-assets.mjs check
          --tag "$TAG" --repo "$REPO" --dist apps/desktop/dist --scope-dist
          --attempts 6 --delay-ms 10000

      - name: Dump release asset states
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/$REPO/releases/tags/$TAG" --jq .id) || exit 0
          {
            echo "### $TAG asset states (${{ matrix.label }})"
            echo '```'
            gh api --paginate "repos/$REPO/releases/$id/assets" \
              --jq '.[] | "\(.name)  state=\(.state)  size=\(.size)  digest=\(.digest // "-")"'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
